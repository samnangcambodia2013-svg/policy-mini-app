<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Policy Management Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div class="max-w-4xl mx-auto py-8 px-4 sm:px-6">
    <!-- Header -->
    <header class="mb-8">
      <h1 class="text-2xl font-bold text-slate-900">Policy Portal</h1>
      <p class="text-sm text-slate-500 mt-1">Search, review customer policies, and log feedback.</p>
    </header>

    <!-- Search & Filters -->
    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Search Policy No</label>
        <div class="flex gap-2">
          <input id="policySearchInput" type="text" placeholder="e.g. 80526043" 
                 class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <button onclick="handleSearch()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition">
            Search
          </button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Filter by Agent</label>
        <select id="agentDropdown" onchange="handleAgentSelect()" 
                class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
          <option value="">Select Agent...</option>
        </select>
      </div>
    </div>

    <!-- Feedback Banner -->
    <div id="statusAlert" class="hidden mb-6 p-4 rounded-lg text-sm font-medium"></div>

    <!-- Details & Update Card -->
    <div id="policyCard" class="hidden bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
      <div class="bg-slate-100 border-b border-slate-200 px-6 py-4 flex justify-between items-center">
        <div>
          <span class="text-xs uppercase tracking-wider font-semibold text-slate-400">Policy Number</span>
          <h2 id="cardPolicyNo" class="text-lg font-bold text-slate-800"></h2>
        </div>
        <span id="cardProductType" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-700"></span>
      </div>

      <div class="p-6">
        <!-- Read-only Info Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-6 pb-6 border-b border-slate-100 text-sm">
          <div>
            <div class="text-slate-400 text-xs">Customer Name</div>
            <div id="cardPoName" class="font-medium text-slate-800 mt-0.5"></div>
          </div>
          <div>
            <div class="text-slate-400 text-xs">Product</div>
            <div id="cardProduct" class="font-medium text-slate-800 mt-0.5"></div>
          </div>
          <div>
            <div class="text-slate-400 text-xs">Kit Type</div>
            <div id="cardKitType" class="font-medium text-slate-800 mt-0.5"></div>
          </div>
          <div>
            <div class="text-slate-400 text-xs">Agent Name</div>
            <div id="cardAgent" class="font-medium text-slate-800 mt-0.5"></div>
          </div>
          <div>
            <div class="text-slate-400 text-xs">Servicing Agent</div>
            <div id="cardServicingAgent" class="font-medium text-slate-800 mt-0.5"></div>
          </div>
          <div>
            <div class="text-slate-400 text-xs">Telegram Linkage</div>
            <div id="cardTelegram" class="font-medium text-slate-800 mt-0.5"></div>
          </div>
        </div>

        <!-- Update Form Fields -->
        <form id="updateForm" onsubmit="handleUpdate(event)" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Reason (Col K)</label>
              <input id="inputReason" type="text" placeholder="e.g. Customer requested call" 
                     class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Date Remark (Col L)</label>
              <input id="inputDateRemark" type="date" 
                     class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Remark / Comment (Col J)</label>
            <textarea id="inputRemark" rows="3" placeholder="Enter follow-up details..." 
                      class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
          </div>

          <div class="flex justify-end pt-2">
            <button id="saveBtn" type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2 rounded-lg text-sm transition">
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Paste your Google Web App URL here
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1UhBG9YdWFQVJS0Upukv0zPjueu-tICqrjNB9a2LQb4qxLCEXmpPJ17W1md9EgLHJvQ/exec";

    window.onload = async () => {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getAgents`);
        const json = await res.json();
        if (json.status === "success") {
          const select = document.getElementById("agentDropdown");
          json.agents.forEach(agent => {
            const opt = document.createElement("option");
            opt.value = agent;
            opt.textContent = agent;
            select.appendChild(opt);
          });
        }
      } catch (err) {
        console.error("Failed to load agent list", err);
      }
    };

    async function handleSearch() {
      const policyNumber = document.getElementById("policySearchInput").value.trim();
      if (!policyNumber) return;

      showAlert("Searching policy...", "info");
      try {
        const res = await fetch(`${SCRIPT_URL}?action=searchPolicy&policyNumber=${encodeURIComponent(policyNumber)}`);
        const json = await res.json();

        if (json.status === "success" && json.found) {
          hideAlert();
          populateCard(json.data);
        } else {
          showAlert("Policy not found. Verify the number and try again.", "error");
          document.getElementById("policyCard").classList.add("hidden");
        }
      } catch (err) {
        showAlert("Error connecting to sheet service.", "error");
      }
    }

    function populateCard(p) {
      document.getElementById("cardPolicyNo").textContent = p.policyNumber;
      document.getElementById("cardProductType").textContent = p.productType || "N/A";
      document.getElementById("cardPoName").textContent = p.poName || "-";
      document.getElementById("cardProduct").textContent = p.product || "-";
      document.getElementById("cardKitType").textContent = p.kitType || "-";
      document.getElementById("cardAgent").textContent = p.agentName || "-";
      document.getElementById("cardServicingAgent").textContent = p.servicingAgent || "-";
      document.getElementById("cardTelegram").textContent = p.telegramLinkage || "-";

      document.getElementById("inputRemark").value = p.remark || "";
      document.getElementById("inputReason").value = p.reason || "";
      document.getElementById("inputDateRemark").value = p.dateRemark || "";

      document.getElementById("policyCard").classList.remove("hidden");
    }

    async function handleUpdate(e) {
      e.preventDefault();
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      const payload = {
        policyNumber: document.getElementById("cardPolicyNo").textContent,
        remark: document.getElementById("inputRemark").value,
        reason: document.getElementById("inputReason").value,
        dateRemark: document.getElementById("inputDateRemark").value
      };

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const json = await res.json();

        if (json.status === "success") {
          showAlert("Policy details updated successfully!", "success");
        } else {
          showAlert(`Failed to update: ${json.message}`, "error");
        }
      } catch (err) {
        showAlert("Failed to save changes. Check connection.", "error");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save Changes";
      }
    }

    function showAlert(msg, type) {
      const alert = document.getElementById("statusAlert");
      alert.className = "mb-6 p-4 rounded-lg text-sm font-medium ";
      if (type === "success") alert.className += "bg-emerald-50 text-emerald-800 border border-emerald-200";
      else if (type === "error") alert.className += "bg-red-50 text-red-800 border border-red-200";
      else alert.className += "bg-blue-50 text-blue-800 border border-blue-200";

      alert.textContent = msg;
      alert.classList.remove("hidden");
    }

    function hideAlert() {
      document.getElementById("statusAlert").classList.add("hidden");
    }
  </script>
</body>
</html>
