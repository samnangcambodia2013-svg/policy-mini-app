<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policy Management Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #f5f5f5);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 12px;
            margin: 0;
            font-size: 14px;
        }
        .container { max-width: 450px; margin: 0 auto; }
        .section { background: var(--card-bg); padding: 12px; border-radius: 10px; margin-bottom: 15px; }
        h3 { margin-top: 0; font-size: 16px; color: var(--button-color); }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 12px; color: var(--hint-color); margin-bottom: 3px; }
        input, select, textarea {
            width: 100%; padding: 8px; border: 1px solid var(--hint-color);
            border-radius: 6px; background: transparent; color: var(--text-color);
            box-sizing: border-box; font-size: 14px;
        }
        button {
            width: 100%; background-color: var(--button-color); color: var(--button-text-color);
            border: none; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 5px;
        }
        .customer-card {
            background: var(--bg-color); padding: 10px; border-radius: 6px; margin-bottom: 8px;
            border-left: 4px solid var(--button-color); font-size: 13px;
        }
        #status-msg { text-align: center; font-size: 13px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- SECTION 1: Policy Lookup & Note Update -->
        <div class="section">
            <h3>🔍 Policy Lookup & Edit</h3>
            <div class="form-group">
                <label>Policy Number</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="policyNumber" placeholder="e.g. 80523155">
                    <button type="button" onclick="searchPolicy()" style="width: 90px; margin-top:0;">Search</button>
                </div>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" readonly>
            </div>
            <div style="display: flex; gap: 8px;" class="form-group">
                <div style="flex:1;">
                    <label>Policy Status</label>
                    <input type="text" id="policySt" readonly>
                </div>
                <div style="flex:1;">
                    <label>Paid To Date</label>
                    <input type="text" id="paidToDate" readonly>
                </div>
            </div>
            <div class="form-group">
                <label>Mobile Number (Editable)</label>
                <input type="text" id="mobileNo" placeholder="Update phone number">
            </div>
            <div class="form-group">
                <label>New Phone Number</label>
                <input type="text" id="newPhoneNumber" placeholder="Enter new phone number">
            </div>
            <div class="form-group">
                <label>Date Allow for Appointment</label>
                <input type="date" id="appointmentDate">
            </div>
            <div class="form-group">
                <label>Comment / Notes (Editable)</label>
                <textarea id="comment" rows="2" placeholder="Add comments or follow-up notes..."></textarea>
            </div>
            <button type="button" onclick="savePolicyData()">Save Changes to Sheet</button>
        </div>

        <!-- SECTION 2: View Customers by Agent Name -->
        <div class="section">
            <h3>👥 View Customer List by Agent</h3>
            <div class="form-group">
                <label>Select Agent Name</label>
                <select id="agentSelect" onchange="loadAgentCustomers()">
                    <option value="">-- Choose Agent --</option>
                </select>
            </div>
            <div id="agent-customer-list" style="max-height: 250px; overflow-y: auto; margin-top: 10px;">
                <p style="color: var(--hint-color); text-align: center; font-size: 12px;">Select an agent to view their customers</p>
            </div>
        </div>

        <div id="status-msg"></div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx1UhBG9YdWFQVJS0Upukv0zPjueu-tICqrjNB9a2LQb4qxLCEXmpPJ17W1md9EgLHJvQ/exec"; // Keep your deployed Web App URL here

        // Load Agent dropdown on startup
        window.onload = async function() {
            try {
                let res = await fetch(`${WEB_APP_URL}?action=getAgents`);
                let result = await res.json();
                let select = document.getElementById('agentSelect');
                result.agents.forEach(agent => {
                    let opt = document.createElement('option');
                    opt.value = agent;
                    opt.innerText = agent;
                    select.appendChild(opt);
                });
            } catch(e) { console.error("Could not load agents"); }
        }

        async function searchPolicy() {
            let policyNo = document.getElementById('policyNumber').value.trim();
            let msg = document.getElementById('status-msg');
            if (!policyNo) { alert("Enter a policy number"); return; }

            msg.innerText = "Searching...";
            let res = await fetch(`${WEB_APP_URL}?action=searchPolicy&policyNumber=${encodeURIComponent(policyNo)}`);
            let result = await res.json();

            if (result.found) {
                document.getElementById('fullName').value = result.data.fullName;
                document.getElementById('policySt').value = result.data.policySt;
                document.getElementById('paidToDate').value = result.data.paidToDate;
                document.getElementById('mobileNo').value = result.data.mobileNo;
                document.getElementById('newPhoneNumber').value = result.data.newPhoneNumber || "";
                document.getElementById('appointmentDate').value = result.data.appointmentDate || "";
                document.getElementById('comment').value = result.data.comment;
                msg.innerText = "Policy loaded!";
                msg.style.color = "green";
            } else {
                msg.innerText = "Policy not found.";
                msg.style.color = "orange";
            }
        }

        async function savePolicyData() {
            let policyNumber = document.getElementById('policyNumber').value.trim();
            let mobileNo = document.getElementById('mobileNo').value.trim();
            let newPhoneNumber = document.getElementById('newPhoneNumber').value.trim();
            let appointmentDate = document.getElementById('appointmentDate').value;
            let comment = document.getElementById('comment').value.trim();
            let msg = document.getElementById('status-msg');

            if (!policyNumber) { alert("No active policy selected"); return; }

            msg.innerText = "Saving...";
            let res = await fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ policyNumber, mobileNo, newPhoneNumber, appointmentDate, comment })
            });
            let result = await res.json();
            if (result.status === "success") {
                msg.innerText = "Saved successfully!";
                msg.style.color = "green";
                window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            } else {
                msg.innerText = "Error saving data.";
                msg.style.color = "red";
            }
        }

        async function loadAgentCustomers() {
            let agentName = document.getElementById('agentSelect').value;
            let listContainer = document.getElementById('agent-customer-list');
            if (!agentName) { listContainer.innerHTML = ""; return; }

            listContainer.innerHTML = "<p style='text-align:center;'>Loading list...</p>";
            let res = await fetch(`${WEB_APP_URL}?action=getByAgent&agentName=${encodeURIComponent(agentName)}`);
            let result = await res.json();

            if (result.customers.length === 0) {
                listContainer.innerHTML = "<p style='text-align:center;'>No customers found for this agent.</p>";
                return;
            }

            let html = "";
            result.customers.forEach(c => {
                html += `
                    <div class="customer-card">
                        <b>${c.fullName}</b> (Policy: ${c.policyNumber})<br>
                        📞 Phone: ${c.mobileNo} | 📱 New Phone: ${c.newPhoneNumber || 'N/A'}<br>
                        📅 Appointment: ${c.appointmentDate || 'N/A'} | Status: ${c.policySt}<br>
                        📅 Paid To: ${c.paidToDate}<br>
                        💬 Note: <i>${c.comment || 'None'}</i>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }
    </script>
</body>
</html>
